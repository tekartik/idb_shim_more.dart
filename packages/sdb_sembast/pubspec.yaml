name: tekartik_sdb_sembast
description: Simple DB (sdb from idb_shim) implementation on top of sembast, experimental.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  idb_shim: ">=2.9.11-1"
  sembast: ">=3.8.5+2"

dev_dependencies:
  idb_test:
    git:
      url: https://github.com/tekartik/idb_shim.dart
      path: idb_test
  lints: ">=6.1.0"
  path: ">=1.9.1"
  sembast_web: ">=2.4.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  test: ">=1.31.0"
resolution: workspace
